version: 1

apps:
  # Ordre = ordre de déploiement (l'API avant le frontend qui l'appelle).
  backend:
    # cPanel (Namecheap, même compte que PECI) crée le sous-domaine
    # backend.universgravure.com DANS ce dossier (universgravure.com/backend).
    deploy_path: /home/manoohpq/universgravure.com/backend
    health_check_url: https://backend.universgravure.com/up
    database: mysql                             # CI : conteneur MySQL 8 (base « ci »)
    lint: true                                  # CI : Pint
    provision: { database: univers_gravure }    # action: provision → base MySQL + .env de production

  frontend:
    deploy_path: /home/manoohpq/universgravure.com
    health_check_url: https://universgravure.com
    lint: true                                  # CI : npm run lint (+ npm test, next build)
    protect_paths: [backend]                    # le backend vit dans ce dossier : rsync --delete l'effacerait
    build_env:
      NEXT_PUBLIC_API_URL: https://backend.universgravure.com/api/v1
      NEXT_PUBLIC_SITE_URL: https://universgravure.com
